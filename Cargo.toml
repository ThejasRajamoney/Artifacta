[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/tf-archive",
    "crates/tf-case",
    "crates/tf-correlate",
    "crates/tf-evtx",
    "crates/tf-log",
    "crates/tf-packaging",
    "crates/tf-pcap",
    "crates/tf-plugin",
    "crates/tf-sandbox",
    "crates/tf-updater",
    "crates/tf-db",
    "crates/tf-model",
    "crates/tf-pe",
    "crates/tf-protocol",
    "crates/tf-report",
    "crates/tf-rules",
    "crates/tf-store",
    "crates/tf-yara",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ThejasRajamoney/Artifacta"
rust-version = "1.98"

[workspace.dependencies]
cms = "=0.2.3"
const-oid = "=0.9.6"
der = "=0.7.10"
md-5 = "0.10.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rsa = "0.9.8"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
tempfile = "3.23.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
ulid = { version = "1.2.1", features = ["serde"] }
x509-cert = "=0.2.5"
yara-x = { version = "1.20.0", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
